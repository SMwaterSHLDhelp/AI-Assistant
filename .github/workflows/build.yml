name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint the frontend
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Lint and test the backend
        run: |
          python -m pip install ruff pytest
          ruff check main.py py_modules tests bridge
          python -m pytest -q

      - name: Install Decky CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x "$RUNNER_TEMP/decky"

      - name: Build plugin zip
        run: |
          "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .
          zipfile="$(find out -name '*.zip' -print -quit)"
          test -n "$zipfile"
          mv "$zipfile" out/AI-Assistant.zip

      - name: Check Decky zip layout
        run: |
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile("out/AI-Assistant.zip")
          names = [name for name in archive.namelist() if name and not name.endswith("/")]
          roots = {name.split("/", 1)[0] for name in names}
          if len(roots) != 1:
              raise SystemExit(f"expected one top-level folder, found {sorted(roots)}")
          root = next(iter(roots))
          required = [
              f"{root}/plugin.json",
              f"{root}/dist/index.js",
              f"{root}/main.py",
              f"{root}/package.json",
              f"{root}/LICENSE",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit("zip is missing: " + ", ".join(missing))
          print(f"Decky zip layout ok under {root}/")
          PY

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant
          path: out/AI-Assistant.zip
          if-no-files-found: error

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AI-Assistant.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
