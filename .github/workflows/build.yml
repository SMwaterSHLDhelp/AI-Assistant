name: Build plugin

# Runs on every push and pull request, including Dependabot. The build job
# typechecks, lints, tests, and builds the Decky zip, and it only needs read
# access so Dependabot's token can run it. The release job runs on version tags.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint the frontend
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Lint and test the backend
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check main.py py_modules tests bridge scripts
          python -m pytest -q

      - name: Install Decky CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x "$RUNNER_TEMP/decky"

      - name: Build plugin zip
        run: |
          "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .
          zipfile="$(find out -name '*.zip' -print -quit)"
          test -n "$zipfile"
          mv "$zipfile" out/AI-Assistant.zip

      - name: Check Decky zip layout
        run: |
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile("out/AI-Assistant.zip")
          names = [name for name in archive.namelist() if name and not name.endswith("/")]
          roots = {name.split("/", 1)[0] for name in names}
          if len(roots) != 1:
              raise SystemExit(f"expected one top-level folder, found {sorted(roots)}")
          root = next(iter(roots))
          required = [
              f"{root}/plugin.json",
              f"{root}/dist/index.js",
              f"{root}/main.py",
              f"{root}/package.json",
              f"{root}/LICENSE",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit("zip is missing: " + ", ".join(missing))
          print(f"Decky zip layout ok under {root}/")
          PY

      - name: Upload plugin zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AI-Assistant
          path: out/AI-Assistant.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download plugin zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AI-Assistant
          path: out

      - name: Place the zip where the release expects it
        run: |
          zipfile="$(find out -name 'AI-Assistant.zip' -print -quit)"
          test -n "$zipfile"
          if [ "$zipfile" != "out/AI-Assistant.zip" ]; then
            mv "$zipfile" out/AI-Assistant.zip
          fi

      - name: Write release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/AI-Assistant.zip
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
