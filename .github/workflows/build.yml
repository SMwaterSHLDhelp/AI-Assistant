name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint the frontend
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Lint and test the backend
        run: |
          python -m pip install ruff pytest
          ruff check main.py py_modules tests
          python -m pytest -q

      - name: Install Decky CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x "$RUNNER_TEMP/decky"

      - name: Build plugin zip
        run: "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant
          path: out/*.zip
          if-no-files-found: error

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
