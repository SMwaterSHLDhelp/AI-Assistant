name: Decky drift

# Rebuilds main against the newest @decky/ui, @decky/api, and Decky CLI.
# A failure opens (or comments on) an issue labeled decky-api-drift.
# A later passing run closes that issue.

on:
  schedule:
    - cron: "23 7 * * 4"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-dev.txt

      - name: Rebuild with the latest Decky libraries
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "Updating @decky/ui and @decky/api"
            pnpm add -D "@decky/ui@latest"
            pnpm add "@decky/api@latest"
            pnpm list @decky/ui @decky/api --depth 0
            pnpm run typecheck
            pnpm run lint
            ruff check main.py py_modules tests bridge scripts
            python -m pytest -q
            python3 scripts/install_latest_decky_cli.py "$RUNNER_TEMP/decky"
            "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .
          } 2>&1 | tee "$RUNNER_TEMP/drift.log"

      - name: Report the drift result
        if: always() && (steps.drift.outcome == 'success' || steps.drift.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.drift.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_LOG: ${{ runner.temp }}/drift.log
        run: python3 scripts/decky_drift_issue.py
