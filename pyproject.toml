[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py_modules"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["main.py", "py_modules", "tests", "bridge", "scripts"]
extend-exclude = ["py_modules/ai_assistant/_frozen", "py_modules/certifi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
